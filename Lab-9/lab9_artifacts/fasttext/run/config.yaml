save_data: lab9_artifacts/fasttext/run/data
src_vocab: lab9_artifacts/fasttext/run/vocab.en
tgt_vocab: lab9_artifacts/fasttext/run/vocab.gu
src_vocab_size: 30000
tgt_vocab_size: 30000
src_words_min_frequency: 2
tgt_words_min_frequency: 2
overwrite: true
share_vocab: false
data:
  corpus_1:
    path_src: lab9_artifacts/fasttext/data/train.en
    path_tgt: lab9_artifacts/fasttext/data/train.gu
    transforms:
    - filtertoolong
  valid:
    path_src: lab9_artifacts/fasttext/data/valid.en
    path_tgt: lab9_artifacts/fasttext/data/valid.gu
src_seq_length: 200
tgt_seq_length: 200
model_task: seq2seq
encoder_type: transformer
decoder_type: transformer
enc_layers: 4
dec_layers: 4
hidden_size: 300
word_vec_size: 300
transformer_ff: 1024
heads: 4
position_encoding: true
dropout:
- 0.2
attention_dropout:
- 0.1
share_decoder_embeddings: true
seed: 42
train_steps: 20000
valid_steps: 1000
early_stopping: 4
save_model: lab9_artifacts/fasttext/run/model
save_checkpoint_steps: 1000
keep_checkpoint: 3
report_every: 200
batch_type: tokens
batch_size: 4096
valid_batch_size: 2048
accum_count:
- 1
optim: adam
adam_beta2: 0.998
decay_method: noam
learning_rate: 2.0
warmup_steps: 2000
max_grad_norm: 0.0
label_smoothing: 0.1
param_init: 0.0
param_init_glorot: true
normalization: tokens
bucket_size: 32768
num_workers: 0
world_size: 1
gpu_ranks: []
embeddings_type: word2vec
src_embeddings: lab9_artifacts/embeddings/fasttext.en.vec
tgt_embeddings: lab9_artifacts/embeddings/fasttext.gu.vec
